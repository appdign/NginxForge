name: Linux native builds and compatibility
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Static Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-plan
          path: build
      - name: Build native static musl binary
        run: python3 scripts/run-container.py --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-linux-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14
  test:
    name: Run ${{ matrix.os }} ${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, rocky-8, rocky-9]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-plan
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-linux-${{ matrix.arch }}
          path: build/artifacts
      - name: Execute packaged binary in native OS userspace
        run: python3 scripts/run-container.py --arch '${{ matrix.arch }}' --test-os '${{ matrix.os }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-linux-${{ matrix.arch }}-${{ matrix.os }}
          path: build/reports/*.json
          if-no-files-found: error
          retention-days: 14
