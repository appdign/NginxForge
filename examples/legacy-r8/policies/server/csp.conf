# Context: server. DEPLOYMENT VALUE: actual API, asset and SSO origins only.
# OFF passes backend CSP through; it does not remove policies emitted by the app.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://app.example.test; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
