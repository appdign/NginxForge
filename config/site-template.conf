# 도메인은 각 사이트 맨 위 server_name 한 줄에만 입력합니다.
# 정책 파일은 기존처럼 분리하며, 아래 include 줄을 주석 처리하여 개별 ON/OFF합니다.

# [4] 외부 웹사이트 -> 이 사이트 API/WS 허용 목록. 기본은 현재 사이트만 자동 허용합니다.
# 키: "사이트 ID|허용할 Origin". 값: 검증한 $http_origin.
# 와일드카드는 대상 사이트/프로토콜/호스트/포트 전체를 ^...$로 고정한 정규식으로 등록합니다.
# API/WS 외부 허용 출처는 아래 map의 default 다음에 추가합니다. API CORS와 WS Origin이 함께 사용합니다.
map "$site_id|$http_origin" $site_external_origin {
    volatile;
    default "";
    # EXTERNAL_ORIGIN_RULES
}

# IP 제한은 가상호스트별로 계산. rate는 여기, burst/연결 수는 각 server에서 조정합니다.
limit_req_zone "$server_name|$binary_remote_addr" zone=site_requests:10m rate=10r/s;
limit_conn_zone "$server_name|$binary_remote_addr" zone=site_connections:10m;

# 알 수 없는 Host/SNI 거부. 기본 listener/map/zone는 주소/포트마다 한 번만 둡니다.
server { listen @@HTTP_LISTEN@@ default_server; server_name _; return 444; }
server { listen @@HTTPS_LISTEN@@ ssl default_server; server_name _; ssl_reject_handshake on; return 444; }

# BEGIN SITE
# [1] 사이트 설정. 도메인은 아래 server_name 한 줄만 변경합니다.
# 가상호스트 추가 시 이 사이트 구역을 복사하고 site_id를 고유하게 지정합니다.
server {
    server_name @@HOST@@;
    # [2] iframe 허용 도메인: 이 한 줄만 바꾸면 CSP와 프레임 헤더가 자동 반영됩니다.
    # 빈값=동일 출처만. 도메인 또는 *.하위도메인 형식. HTTP/HTTPS 부모의 모든 포트를 허용합니다.
    # API/CORS/WebSocket 허용 목록과는 독립적이며 임베드 허용만 변경합니다.
    # 와일드카드는 하위 도메인만 허용하고 최상위 도메인 자체/악성 suffix는 포함하지 않습니다.
    set $site_embed_domain @@EMBED_DOMAIN@@;
    set $site_id @@SITE_ID@@;
    listen @@HTTP_LISTEN@@;
    listen @@HTTPS_LISTEN@@ ssl;
    http2 on;
    set $site_https_port "@@HTTPS_AUTH_PORT@@";
    # [KISA WEB-20] TLS 인증서/개인키. 공유 TLS 정책은 nginx.conf에서 한 번 로드합니다.
    ssl_certificate @@CERT@@;
    ssl_certificate_key @@KEY@@;
    # [KISA WEB-06/WEB-11/WEB-17] 전용 웹 루트. 불필요한 alias/가상 디렉터리와 비밀 파일을 두지 않습니다.
    root @@ROOT@@;

    # 외부 웹사이트 -> API: restricted=현재 사이트+아래 외부 허용 목록, public=모든 HTTP(S) 출처.
    # public API는 쿠키/세션 CORS를 제공하지 않습니다. '*'와 credentials=true를 함께 응답하지 않습니다.
    set $site_cors_mode restricted;
    set $site_cors_credentials true;
    set $site_cors_methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS";
    set $site_cors_headers "Content-Type, Authorization, X-CSRF-TOKEN, X-XSRF-TOKEN";
    # WS 공개 여부는 API와 독립적입니다. Origin 없는 native WS는 검토 후 1로 변경합니다.
    set $site_ws_mode restricted;
    set $site_allow_originless_ws 0;

    # 이 사이트 화면 -> 외부 API/WSS/CDN 허용은 아래 CSP의 해당 src에서 조정합니다.
    # 현재 호스트/포트는 자동 반영. 인라인 CSS 허용, 인라인 script/onclick/eval 차단.
    set $site_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://$host$site_origin_port; object-src 'none'; base-uri 'self'; frame-ancestors $site_frame_ancestors; form-action 'self'";

    # 현재 사이트와 정확히 같은 출처 또는 이 site_id의 외부 허용 목록만 승인합니다.
    set $site_self_origin "$scheme://$host$site_origin_port";
    set $site_origin_allowed 0;
    if ($http_origin = $site_self_origin) { set $site_origin_allowed 1; }
    if ($site_external_origin != "") { set $site_origin_allowed 1; }

    # HTTP는 같은 호스트 HTTPS로 이동합니다. 포트도 위 사이트 값만 참조합니다.
    include policies/server/https-redirect.conf; # [KISA WEB-21] HTTP -> HTTPS 308 이동

    # [3] 사이트별 제한. 전체 1 GiB는 파일+폼+multipart 형식이며 파일당 50 MiB는 backend 설정입니다.
    client_max_body_size @@BODY@@; # [KISA WEB-08] 요청 전체 상한. 다운로드/파일당 용량은 앱에서 처리
    client_body_timeout 60s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_req_status 429;
    limit_req zone=site_requests burst=20 nodelay;
    limit_conn_status 429;
    limit_conn site_connections 20;

    # [KISA WEB-10] 고정 backend와 전달 헤더. 실제 목적지는 각 location의 proxy_pass에서 설정합니다.
    # backend/쿠키/오류 처리. 앱의 업무 오류 JSON을 유지하려면 proxy_intercept_errors를 off로 선택합니다.
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_intercept_errors on;
    # [추가 강화] 세션 쿠키. HTTP SAP 안의 iframe 로그인은 SameSite/브라우저 쿠키 정책을 별도 점검합니다.
    proxy_cookie_flags JSESSIONID secure httponly samesite=lax;
    proxy_cookie_flags SESSION secure httponly samesite=lax;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";

    # ===== KISA 2026 웹 서비스 점검 연결 =====
    # 아래 WEB-xx는 설정과 점검 항목의 연결이며 자동 합격 판정이 아닙니다.
    # [KISA WEB-01/WEB-02] 관리자 계정명/암호: Spring/Tomcat/IdP에서 별도 점검.
    # [KISA WEB-03] 비밀번호 파일 권한: OS ACL/소유자 점검. 실제 비밀값을 conf에 기록하지 않습니다.
    # [KISA WEB-09] 프로세스 권한: 전용 실행 계정/서비스 계정 및 파일 쓰기 권한 점검.
    # [KISA WEB-23] LDAP 인증 알고리즘: 사용 중인 backend/IdP에서 점검.
    # [KISA WEB-25] 보안 패치: 세 플랫폼 동일 소스/패치/의존성 및 릴리즈 gate로 검증.
    # [KISA WEB-26] 로그 권한: nginx.conf 로그 위치와 OS ACL/회전/보존 정책 점검.
    # 공통 보안 정책: 각 줄 앞에 #을 붙여 OFF, 제거하여 ON합니다.
    # 도메인/허용 출처/backend는 정책 파일을 수정하지 않고 이 사이트에서만 관리합니다.
    include policies/server/identity.conf; # [KISA WEB-16] Server/제품 버전 정보 제거
    include policies/server/directory-listing.conf; # [KISA WEB-04] 디렉터리 목록 출력 금지
    include policies/server/ssi.conf; # [KISA WEB-19] SSI 실행 비활성화
    include policies/server/compression.conf; # [추가 강화] 민감 응답 압축 비활성화
    include policies/server/symlinks.conf; # [KISA WEB-12] Linux 링크 차단 / Windows NTFS·ACL 별도 점검
    include policies/server/nosniff.conf; # [추가 강화] MIME 추측 방지
    include policies/server/frame-options.conf; # [추가 강화] 프레임 헤더 자동 연동: 임베드 도메인이 있으면 CSP 허용 목록 사용
    include policies/server/referrer-policy.conf; # [추가 강화] Referer 전달 범위 제한
    include policies/server/csp-spa.conf; # [추가 강화] CSP 및 iframe 부모 허용. 실제 값은 위 사이트 변수만 수정
    include policies/server/permissions-policy.conf; # [추가 강화] 카메라/마이크/위치 기본 제한
    include policies/server/hsts.conf; # [KISA WEB-20/WEB-21 보완] HTTPS 유지
    include policies/server/secret-files.conf; # [KISA WEB-07/WEB-13/WEB-14] 숨김·설정·키·백업 파일 접근 차단
    include policies/server/script-files.conf; # [KISA WEB-05/WEB-15] CGI/스크립트/실행 파일 URL 차단
    include policies/server/uploads.conf; # [KISA WEB-24] 업로드 경로 직접 접근 차단. 저장소/내용 검증은 앱에서 처리
    include policies/server/management-paths.conf; # [KISA WEB-14 보완] 공개 Actuator/Swagger/H2 진단 경로 차단
    include policies/server/sourcemaps.conf; # [KISA WEB-07 보완] 배포 소스맵 노출 차단
    include policies/server/generic-errors.conf; # [KISA WEB-22] 오류 정보 최소화. html/__nginxforge_error.html도 함께 설치
    include policies/server/private-cache-spa.conf; # [추가 강화] API/오류 no-store, 정상 정적 파일은 분리
    include policies/server/cors.conf; # [추가 강화] 검증한 실제 Origin만 응답. iframe 옵션과 독립적인 기존 허용 목록 적용
    # 관리 경로/IP는 필요할 때 이 사이트에 location을 작성합니다.
    # location /api/admin/ {
    #     allow 192.0.2.123; # 실제 관리망으로 변경
    #     include policies/server/admin-acl.conf;
    #     proxy_pass http://@@SPRING@@;
    # }


    location = /api { return 308 /api/$is_args$args; }
    location = /storagewiz { return 308 /storagewiz/$is_args$args; }
    location = /process_file { return 308 /process_file/$is_args$args; }

    # API/storage. proxy_pass 끝에 '/'를 붙이지 않아 prefix와 query를 유지합니다.
    # 메소드를 바꾸면 아래 검사식과 위 CORS 응답 메소드 목록을 함께 바꿉니다.
    location /api/ {
        if ($site_api_origin_rejected) { return 403; }
        if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 405; }
        if ($http_access_control_request_method !~ "^(|GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://@@SPRING@@;
    }
    location /storagewiz/ {
        if ($site_api_origin_rejected) { return 403; }
        if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 405; }
        if ($http_access_control_request_method !~ "^(|GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://@@STORAGE@@;
    }
    # WS: upgrade는 WS Origin 규칙, 일반 HTTP는 API Origin 규칙을 사용합니다.
    location /process_file/ {
        include policies/location/websocket-origin.conf;
        if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 405; }
        if ($http_access_control_request_method !~ "^(|GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 하위 proxy_set_header는 상위 목록을 상속하지 않아 전체 전달 헤더를 명시합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://@@SPRING@@;
    }
    # [KISA WEB-18] 불필요 메소드/WebDAV 제한. 화면은 GET/HEAD, POST는 실제 API 경로로 보냅니다.
    # 정적 영역만 GET/HEAD 제한. index가 없으면 404입니다.
    location = /index.html {
        include policies/server/methods-static.conf;
        try_files $uri =404;
    }
    location / {
        include policies/server/methods-static.conf;
        try_files $uri $uri/ /index.html;
    }
}
# END SITE

# [5] 자동 계산 구역: 보통 수정하지 않습니다. 사이트 값은 위 [1]~[3]에서 관리합니다.
# iframe 옵션 자동 계산: 도메인/헤더를 여기 반복 입력하지 않습니다.
# 형식이 잘못되면 동일 출처만 허용합니다. API/CORS/WS map은 별도로 유지합니다.
map $site_embed_domain $site_embed_domain_valid {
    default 0;
    ~*^([*][.])?[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)*$ 1;
}
map $site_embed_domain_valid $site_frame_ancestors {
    default "'self'";
    1 "'self' http://$site_embed_domain:* https://$site_embed_domain:*";
}
map $site_embed_domain_valid $site_x_frame_options { default SAMEORIGIN; 1 ""; }

# 공통 계산. 기본 포트는 생략하고 비표준 포트는 현재 접속 Origin/CSP에 반영합니다.
map "$scheme:$request_port" $site_origin_port {
    default "$is_request_port$request_port";
    "https:443" "";
    "http:80" "";
    "https:" "";
    "http:" "";
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map "$site_cors_mode|$http_origin|$site_origin_allowed" $site_cors_origin {
    default "";
    ~^restricted[|]https?://[^|]+[|]1$ $http_origin;
    ~^public[|]https?://[^|]+[|][01]$ "*";
}
map "$site_cors_origin|$site_cors_credentials" $site_cors_credentials_header {
    default "";
    ~^https?://[^|]+[|]true$ true;
}
map "$site_cors_mode|$http_origin|$site_origin_allowed" $site_api_origin_rejected {
    default 1;
    ~^restricted[|][|][01]$ 0;
    ~^restricted[|]https?://[^|]+[|]1$ 0;
    ~^public[|]https?://[^|]+[|][01]$ 0;
    ~^public[|][|][01]$ 0;
}
map "$site_ws_mode|$site_origin_allowed|$http_origin|$site_allow_originless_ws" $site_ws_origin_rejected {
    default 1;
    ~^restricted[|]1[|]https?://[^|]+[|][01]$ 0;
    ~^public[|][01][|]https?://[^|]+[|][01]$ 0;
    ~^(restricted|public)[|][01][|][|]1$ 0;
}
map $http_upgrade $site_process_origin_rejected {
    default $site_api_origin_rejected;
    ~*^websocket$ $site_ws_origin_rejected;
}
# API 경로를 바꾸면 location과 아래 URI 분류를 함께 바꿉니다.
map $uri $site_api_path { default 0; ~^/(api|storagewiz|process_file)(/|$) 1; /__nginxforge_error.html 1; }
map "$site_api_path|$uri" $site_cache_control {
    default "";
    ~^1[|] no-store;
    ~[|]/__nginxforge_error.html$ no-store;
}
map $site_api_path $site_api_cors_origin { default ""; 1 $site_cors_origin; }
map $site_api_path $site_api_cors_credentials { default ""; 1 $site_cors_credentials_header; }
map "$site_api_path|$site_cors_origin" $site_cors_methods_header { default ""; ~^1[|].+$ $site_cors_methods; }
map "$site_api_path|$site_cors_origin" $site_cors_headers_header { default ""; ~^1[|].+$ $site_cors_headers; }
map $site_api_path $site_cors_vary { default ""; 1 Origin; }
