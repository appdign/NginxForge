# 운영자가 수정하는 설정은 이 파일 하나입니다.
# [1] 외부 허용 목록 -> [2] 사이트/CSP -> [3] API/WS/backend/제한 순으로 관리합니다.

# [1] 외부 웹사이트 -> 이 사이트 API/WS 허용 목록. 기본은 현재 사이트만 자동 허용합니다.
# 키: "대상 server_name|허용할 Origin". 값: 검증한 $http_origin.
# 와일드카드는 대상 사이트/프로토콜/호스트/포트 전체를 ^...$로 고정한 정규식으로 등록합니다.
# EXTERNAL_ORIGIN_RULES 위치에 규칙을 추가합니다. API CORS와 WS Origin이 함께 사용합니다.
map "$server_name|$http_origin" $site_external_origin {
    default "";
    # EXTERNAL_ORIGIN_RULES
}

# IP 제한은 가상호스트별로 계산. rate는 여기, burst/연결 수는 각 server에서 조정합니다.
limit_req_zone "$server_name|$binary_remote_addr" zone=site_requests:10m rate=10r/s;
limit_conn_zone "$server_name|$binary_remote_addr" zone=site_connections:10m;

# 알 수 없는 Host/SNI 거부. 기본 listener/map/zone는 주소/포트마다 한 번만 둡니다.
server { listen @@HTTP_LISTEN@@ default_server; server_name _; return 444; }
server { listen @@HTTPS_LISTEN@@ ssl default_server; server_name _; ssl_reject_handshake on; return 444; }

# BEGIN SITE
# [2] 도메인/인증서/root. 가상호스트 추가 시 BEGIN SITE~END SITE 구역만 복사합니다.
server {
    listen @@HTTP_LISTEN@@;
    server_name @@HOST@@;
    return 308 https://$host@@HTTPS_AUTH_PORT@@$request_uri;
}
server {
    listen @@HTTPS_LISTEN@@ ssl;
    http2 on;
    server_name @@HOST@@;
    ssl_certificate @@CERT@@;
    ssl_certificate_key @@KEY@@;
    root @@ROOT@@;

    # 외부 웹사이트 -> API: restricted=현재 사이트+상단 목록, public=모든 HTTP(S) 출처.
    # public API는 쿠키/세션 CORS를 제공하지 않습니다. '*'와 credentials=true를 함께 응답하지 않습니다.
    set $site_cors_mode restricted;
    set $site_cors_credentials true;
    set $site_cors_methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS";
    set $site_cors_headers "Content-Type, Authorization, X-CSRF-TOKEN, X-XSRF-TOKEN";
    # WS 공개 여부는 API와 독립적입니다. Origin 없는 native WS는 검토 후 1로 변경합니다.
    set $site_ws_mode restricted;
    set $site_allow_originless_ws 0;

    # 이 사이트 화면 -> 외부 API/WSS/CDN 허용은 아래 CSP의 해당 src에서 조정합니다.
    # 현재 호스트/포트는 자동 반영. 인라인 CSS 허용, 인라인 script/onclick/eval 차단.
    set $site_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://$host$site_origin_port; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";

    # 현재 사이트와 정확히 같은 출처 또는 이 server_name의 외부 허용 목록만 승인합니다.
    set $site_self_origin "$scheme://$host$site_origin_port";
    set $site_origin_allowed 0;
    if ($http_origin = $site_self_origin) { set $site_origin_allowed 1; }
    if ($site_external_origin != "") { set $site_origin_allowed 1; }

    # [3] 사이트별 제한. 전체 1 GiB는 파일+폼+multipart 형식이며 파일당 50 MiB는 backend 설정입니다.
    client_max_body_size @@BODY@@;
    client_body_timeout 60s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_req_status 429;
    limit_req zone=site_requests burst=20 nodelay;
    limit_conn_status 429;
    limit_conn site_connections 20;

    # backend/쿠키/오류 처리. 앱의 업무 오류 JSON을 유지하려면 proxy_intercept_errors를 off로 선택합니다.
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_intercept_errors on;
    proxy_cookie_flags JSESSIONID secure httponly samesite=lax;
    proxy_cookie_flags SESSION secure httponly samesite=lax;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";

    # 고정 공통 보안 규칙. 이 파일 외에 도메인/backend 값을 입력하지 않습니다.
    include policy.conf;

    # API 응답 정책. 정적 정상 응답에는 CORS/no-store를 추가하지 않습니다.
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    add_header Cache-Control $site_cache_control always;
    add_header Access-Control-Allow-Origin $site_api_cors_origin always;
    add_header Access-Control-Allow-Credentials $site_api_cors_credentials always;
    add_header Access-Control-Allow-Methods $site_cors_methods_header always;
    add_header Access-Control-Allow-Headers $site_cors_headers_header always;
    add_header Vary $site_cors_vary always;

    location = /api { return 308 /api/$is_args$args; }
    location = /storagewiz { return 308 /storagewiz/$is_args$args; }
    location = /process_file { return 308 /process_file/$is_args$args; }

    # API/storage. proxy_pass 끝에 '/'를 붙이지 않아 prefix와 query를 유지합니다.
    # 메소드를 바꾸면 아래 검사식과 위 CORS 응답 메소드 목록을 함께 바꿉니다.
    location /api/ {
        if ($site_api_origin_rejected) { return 403; }
        if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 405; }
        if ($http_access_control_request_method !~ "^(|GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://@@SPRING@@;
    }
    location /storagewiz/ {
        if ($site_api_origin_rejected) { return 403; }
        if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 405; }
        if ($http_access_control_request_method !~ "^(|GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://@@STORAGE@@;
    }
    # WS: upgrade는 WS Origin 규칙, 일반 HTTP는 API Origin 규칙을 사용합니다.
    location /process_file/ {
        if ($site_process_origin_rejected) { return 403; }
        if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 405; }
        if ($http_access_control_request_method !~ "^(|GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 하위 proxy_set_header는 상위 목록을 상속하지 않아 전체 전달 헤더를 명시합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://@@SPRING@@;
    }
    # 정적 영역만 GET/HEAD 제한. index가 없으면 404입니다.
    location = /index.html {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        try_files $uri =404;
    }
    location / {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        try_files $uri $uri/ /index.html;
    }
}
# END SITE

# [4] 자동 계산 구역: 보통 수정하지 않습니다. 사이트 값은 위 [1]~[3]에서 관리합니다.
# 공통 계산. 기본 포트는 생략하고 비표준 포트는 현재 접속 Origin/CSP에 반영합니다.
map "$scheme:$request_port" $site_origin_port {
    default "$is_request_port$request_port";
    "https:443" "";
    "http:80" "";
    "https:" "";
    "http:" "";
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map "$site_cors_mode|$http_origin|$site_origin_allowed" $site_cors_origin {
    default "";
    ~^restricted[|]https?://[^|]+[|]1$ $http_origin;
    ~^public[|]https?://[^|]+[|][01]$ "*";
}
map "$site_cors_origin|$site_cors_credentials" $site_cors_credentials_header {
    default "";
    ~^https?://[^|]+[|]true$ true;
}
map "$site_cors_mode|$http_origin|$site_origin_allowed" $site_api_origin_rejected {
    default 1;
    ~^restricted[|][|][01]$ 0;
    ~^restricted[|]https?://[^|]+[|]1$ 0;
    ~^public[|]https?://[^|]+[|][01]$ 0;
    ~^public[|][|][01]$ 0;
}
map "$site_ws_mode|$site_origin_allowed|$http_origin|$site_allow_originless_ws" $site_ws_origin_rejected {
    default 1;
    ~^restricted[|]1[|]https?://[^|]+[|][01]$ 0;
    ~^public[|][01][|]https?://[^|]+[|][01]$ 0;
    ~^(restricted|public)[|][01][|][|]1$ 0;
}
map $http_upgrade $site_process_origin_rejected {
    default $site_api_origin_rejected;
    ~*^websocket$ $site_ws_origin_rejected;
}
# API 경로를 바꾸면 location과 아래 URI 분류를 함께 바꿉니다.
map $uri $site_api_path { default 0; ~^/(api|storagewiz|process_file)(/|$) 1; /__nginxforge_error.html 1; }
map "$site_api_path|$uri" $site_cache_control {
    default "";
    ~^1[|] no-store;
    ~[|]/__nginxforge_error.html$ no-store;
}
map $site_api_path $site_api_cors_origin { default ""; 1 $site_cors_origin; }
map $site_api_path $site_api_cors_credentials { default ""; 1 $site_cors_credentials_header; }
map "$site_api_path|$site_cors_origin" $site_cors_methods_header { default ""; ~^1[|].+$ $site_cors_methods; }
map "$site_api_path|$site_cors_origin" $site_cors_headers_header { default ""; ~^1[|].+$ $site_cors_headers; }
map $site_api_path $site_cors_vary { default ""; 1 Origin; }
