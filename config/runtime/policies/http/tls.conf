# [KISA WEB-20]
# [취약점] 취약한 SSL/TLS 버전·암호 사용으로 통신 기밀성이 약해질 위험
# [조치] TLS 1.2/1.3와 선택한 암호·세션 정책 적용
# [별도 점검] 실제 인증서의 유효기간·신뢰·개인키 권한은 운영에서 점검
# Context: http. Shared TLS policy. Default listeners are declared once in site.conf.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:forge_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
