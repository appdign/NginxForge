# [추가 강화]
# [취약점] 미등록 Host/SNI로 잘못된 가상호스트가 노출되거나 호스트 정보가 악용될 위험
# [조치] 알 수 없는 HTTP Host와 TLS SNI를 기본 리스너에서 거부
# [별도 점검] 실제 사이트 리스너와 겹치지 않게 한 번만 선언
# Context: http. Install once per address/port. OFF lets a domain become the default.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
