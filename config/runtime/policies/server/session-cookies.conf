# [추가 강화]
# [취약점] 세션 쿠키가 평문 전송·스크립트 접근·일부 교차 사이트 요청에 노출될 위험
# [조치] 지정 세션 쿠키에 Secure/HttpOnly/SameSite 플래그 적용
# [별도 점검] 인증·세션 수명·CSRF 검증은 앱에서 처리하며 iframe의 쿠키 호환성 별도 점검
# Context: API server. DEPLOYMENT VALUES: actual cookie names and SSO SameSite.
proxy_cookie_flags JSESSIONID secure httponly samesite=lax;
proxy_cookie_flags SESSION secure httponly samesite=lax;
# XSRF-TOKEN stays JS-readable. Session lifecycle and CSRF validation belong to the app.
