# [KISA WEB-22]
# [취약점] 오류 응답의 서버 정보·내부 경로·상세 예외가 노출될 위험
# [조치] 지정한 오류에 일반 오류 페이지 적용
# [별도 점검] NGINX prefix의 html/__nginxforge_error.html을 함께 설치하고 앱 오류 형식 검토
# Context: server. OFF restores original backend error bodies.
# Review API error schemas before enabling interception.
# Choose proxy_intercept_errors on/off in site.conf.
error_page 400 403 404 405 413 414 429 500 502 503 504 /__nginxforge_error.html;
location = /__nginxforge_error.html { internal; root html; }
