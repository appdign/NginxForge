# Context: server. Origin/method decisions and maps belong to site.conf.
# Static responses get no CORS headers. Authentication and CSRF stay in the app.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
add_header Access-Control-Allow-Origin $site_api_cors_origin always;
add_header Access-Control-Allow-Credentials $site_api_cors_credentials always;
add_header Access-Control-Allow-Methods $site_cors_methods_header always;
add_header Access-Control-Allow-Headers $site_cors_headers_header always;
add_header Vary $site_cors_vary always;
