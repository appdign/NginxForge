# Context: mixed SPA/API server. Required map: maps/spa-api-websocket.conf.
# Co-locate with the other server response policies so proxy_hide_header inheritance
# is preserved. Static success responses get no Cache-Control from this policy.
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
add_header Cache-Control $forge_spa_cache_control always;
