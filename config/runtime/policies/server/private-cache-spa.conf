# [추가 강화]
# [취약점] 사용자별 API·오류 응답이 브라우저·중간 캐시에 남을 위험
# [조치] site.conf에서 분류한 API/오류만 no-store 처리
# [별도 점검] 정상 정적 파일과 구분하며 개인 데이터가 담긴 다른 경로도 점검
# Context: mixed SPA/API server. Path classification is in site.conf.
# OFF restores backend cache headers. Static success responses are unaffected.
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
add_header Cache-Control $site_cache_control always;
