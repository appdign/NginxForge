# [추가 강화]
# [취약점] XSS 영향·임의 외부 연결·허용하지 않은 프레임 삽입 위험
# [조치] site.conf의 CSP를 단일 헤더로 발행하고 upstream 중복 정책 숨김
# [별도 점검] csp-spa.conf와 둘 중 하나만 사용하며 앱의 출력 취약점은 코드에서 수정
# Context: server. CSP destinations/options are set only in site.conf ($site_csp).
# Choose either csp.conf or csp-spa.conf, never both. OFF restores upstream CSP.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
add_header Content-Security-Policy $site_csp always;
