# Context: server/location. File-server alternative to body-size.conf, not additive.
# 1 GiB is the whole HTTP request body: files + fields + multipart framing.
# NGINX does not enforce 50 MiB per file or 5 MiB of non-file fields.
# See the separate reference docs/backend/application-upload.yml.example for Spring/Tomcat.
client_max_body_size 1g;
