# [추가 강화]
# [취약점] 느린 요청·과도한 헤더·장기 연결로 자원이 소진될 위험
# [조치] 요청/응답 유휴 시간과 헤더 버퍼 등의 기본 제한 적용
# [별도 점검] 업로드·공유 IP·신뢰 프록시 환경에 맞게 실제 업무 부하 검토
# Context: server. DEPLOYMENT VALUES: tune to actual workload.
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
keepalive_timeout 30s;
keepalive_requests 1000;
ignore_invalid_headers on;
underscores_in_headers off;
large_client_header_buffers 4 8k;
