# [KISA WEB-20/WEB-21 보완]
# [취약점] 이미 방문한 HTTPS 사이트로의 HTTP 접속·다운그레이드 위험
# [조치] 브라우저에 HTTPS 사용 기간을 알리는 HSTS 발행
# [별도 점검] 실제 HTTPS·인증서가 정상이어야 하며 브라우저에 저장된 정책은 만료까지 유지
# Context: HTTPS server only. Browsers retain previously received HSTS until expiry.
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=31536000" always;
