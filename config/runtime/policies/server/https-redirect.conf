# [KISA WEB-21]
# [취약점] 평문 HTTP로 서비스에 접근하여 정보가 노출될 위험
# [조치] HTTP 요청을 같은 사이트의 HTTPS로 308 이동
# [별도 점검] 실제 HTTPS 리스너·인증서·포트는 site.conf에서 점검
# Context: server. Domain/HTTPS port come from this site's site.conf values.
# One server_name handles both HTTP and HTTPS; no duplicate domain setting.
if ($scheme = http) { return 308 https://$host$site_https_port$request_uri; }
