# [추가 강화]
# [취약점] 다른 사이트가 화면을 감싸 사용자 클릭을 유도하는 클릭재킹 위험
# [조치] site.conf의 iframe 허용 값에 따라 CSP와 X-Frame-Options 연동
# [별도 점검] iframe 허용은 API/CORS/WebSocket·세션 쿠키 허용과 독립적
# Context: server. The single embedding-domain option and all calculations live in site.conf.
# SAMEORIGIN by default. An explicit embedding domain uses CSP frame-ancestors instead.
# Always hide upstream XFO so it cannot conflict with the per-site allowlist.
proxy_hide_header X-Frame-Options;
add_header X-Frame-Options $site_x_frame_options always;
