# [추가 강화]
# [취약점] 민감한 API 응답이 브라우저·중간 캐시에 저장될 위험
# [조치] API 응답에 no-store를 발행하고 backend 캐시 헤더 숨김
# [별도 점검] 공개 정적 파일에 적용할 때는 캐시 성능과 업무 요구를 별도 검토
# Context: private API server. OFF restores backend cache headers.
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
add_header Cache-Control "no-store" always;
