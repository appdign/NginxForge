# [KISA WEB-05/WEB-15 보완]
# [취약점] 불필요한 CGI/스크립트·실행 파일 URL이 노출되거나 매핑될 위험
# [조치] 지정한 스크립트·실행 파일 확장자 요청 차단
# [별도 점검] 실제 FastCGI·앱 실행 매핑과 파일 배포 제거도 별도 점검
# Context: server. Block script/executable URL mappings.
location ~* \.(php|phtml|cgi|pl|py|jsp|jspx|asp|aspx|ashx|asmx|shtml|shtm|exe|dll|bat|cmd|ps1)(/|$) { return 404; }
