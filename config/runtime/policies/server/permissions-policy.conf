# [추가 강화]
# [취약점] 불필요한 브라우저 장치·위치 기능이 사용될 위험
# [조치] 카메라·마이크·위치 기능을 기본 제한
# [별도 점검] 업무상 필요한 브라우저 기능은 별도로 검토
# Context: server. DEPLOYMENT VALUE: allow only required browser features/origins.
proxy_hide_header Permissions-Policy;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
