# Context: server. DEPLOYMENT VALUE: actual site/WSS origin and required assets/SSO.
# SPA compatibility: permit inline CSS (style attributes/style elements), not inline JavaScript.
# For stricter CSS, coordinate per-response nonces or build-time hashes with the application.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://example.test; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
