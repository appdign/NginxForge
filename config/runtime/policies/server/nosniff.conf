# [추가 강화]
# [취약점] 브라우저가 MIME을 추측해 파일을 스크립트 등으로 해석할 위험
# [조치] X-Content-Type-Options: nosniff 발행
# [별도 점검] mime.types의 실제 CSS/JS/MJS 매핑과 업로드 응답 Content-Type도 점검
# Context: server. Header ownership is switched together with its policy.
proxy_hide_header X-Content-Type-Options;
add_header X-Content-Type-Options nosniff always;
