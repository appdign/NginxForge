# [KISA WEB-07/WEB-13/WEB-14 보완]
# [취약점] 숨김·설정·키·백업 파일이 웹으로 노출될 위험
# [조치] 민감 경로와 파일 확장자 요청 차단
# [별도 점검] 불필요한 파일 삭제·웹 루트 분리·OS 파일 권한은 별도 조치
# Context: server. Keep regex locations before the admin ACL and location /.
location ~ (^|/)\. { return 404; }
location ~* ^/(conf|config|logs|temp|private|secrets|WEB-INF|META-INF)(/|$) { return 404; }
location ~* \.(conf|config|ini|log|sql|bak|old|orig|save|swp|pem|key|pfx|p12|yaml|yml|env)$ { return 404; }
