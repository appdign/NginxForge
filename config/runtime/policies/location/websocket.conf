# [KISA WEB-10 보완 / 추가 강화]
# [취약점] 잘못된 업그레이드 전달·위조 전달 헤더·장기 연결로 자원이 점유될 위험
# [조치] 업그레이드 헤더와 실제 연결 정보를 전달하고 유휴 시간 제한
# [별도 점검] 업무 인증·세션 만료·ping 및 실제 연결 수 제한은 별도 점검
# Context: WebSocket proxy location. Keep the complete forwarding policy here:
# defining any proxy_set_header here replaces inheritance from the server.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Forwarded "";
proxy_buffering off;
# DEPLOYMENT VALUE: idle interval between reads, not total socket lifetime.
# Backend/application ping and authentication/session handling remain necessary.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
