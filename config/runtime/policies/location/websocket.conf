# Context: WebSocket proxy location. Keep the complete forwarding policy here:
# defining any proxy_set_header here replaces inheritance from the server.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Forwarded "";
proxy_buffering off;
# DEPLOYMENT VALUE: idle interval between reads, not total socket lifetime.
# Backend/application ping and authentication/session handling remain necessary.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
