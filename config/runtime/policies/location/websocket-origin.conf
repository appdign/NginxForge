# [추가 강화]
# [취약점] 허용하지 않은 사이트가 사용자 세션으로 WebSocket을 여는 위험
# [조치] site.conf의 WebSocket 출처 검사 결과로 업그레이드 요청 제한
# [별도 점검] 출처 검사는 backend의 인증·인가를 대신하지 않음
# Context: WebSocket proxy location. Origin decisions/maps belong to site.conf.
# Upgrade uses WS rules; ordinary HTTP uses API rules. Authentication stays in the app.
if ($site_process_origin_rejected) { return 403; }
