# [KISA WEB-18 보완]
# [취약점] 불필요한 WebDAV·TRACE 등 HTTP 메소드가 노출될 위험
# [조치] 업무 REST 메소드만 허용하고 나머지 요청 거부
# [별도 점검] 필요한 업무 메소드는 site.conf의 CORS 응답 목록과 함께 검토
# Context: proxy location only. Keep static GET/HEAD restrictions inside static locations.
if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") { return 405; }
