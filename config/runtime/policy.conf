# Common server security. No site domains, backends or business limits.
# Configure site values in site.conf; include once in each HTTPS server.
server_tokens off;
more_clear_headers Server X-Powered-By;
autoindex off;
ssi off;
gzip off;
# NGINXFORGE_PLATFORM_POLICY
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
add_header Content-Security-Policy $site_csp always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
error_page 400 403 404 405 413 414 429 500 502 503 504 /__nginxforge_error.html;
location = /__nginxforge_error.html { internal; root html; }
location ~ (^|/)\. { return 404; }
location ~* ^/(conf|config|logs|temp|private|secrets|WEB-INF|META-INF)(/|$) { return 404; }
location ~* \.(conf|config|ini|log|sql|bak|old|orig|save|swp|pem|key|pfx|p12|yaml|yml|env)$ { return 404; }
location ~* \.(php|phtml|cgi|pl|py|jsp|jspx|asp|aspx|ashx|asmx|shtml|shtm|exe|dll|bat|cmd|ps1)(/|$) { return 404; }
location ~* ^/uploads(/|$) { return 404; }
location ~* ^/(actuator|swagger-resources|v2/api-docs|v3/api-docs|h2-console)(/|$) { return 404; }
location ~* ^/swagger-ui(\.html|/|$) { return 404; }
location ~* \.map$ { return 404; }
