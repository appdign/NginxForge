# Server-context profile. Application routes/extensions may need reviewed exceptions.
limit_req zone=forge_requests burst=20 nodelay;
limit_conn forge_connections 20;
error_page 400 403 404 405 413 414 429 500 502 503 504 /__nginxforge_error.html;
location = /__nginxforge_error.html {
    internal;
    root html;
}
# Do not expose dotfiles, configuration, credentials, backups or deployment artifacts.
location ~ (^|/)\. { return 404; }
location ~* ^/(conf|config|logs|temp|private|secrets|uploads|WEB-INF|META-INF)(/|$) { return 404; }
location ~* \.(conf|config|ini|log|sql|bak|old|orig|save|swp|pem|key|pfx|p12|yaml|yml|env)$ { return 404; }
# This profile serves static content or proxies to an application; it runs no CGI/ISAPI/scripts.
location ~* \.(php|phtml|cgi|pl|py|jsp|jspx|asp|aspx|ashx|asmx|shtml|shtm|exe|dll|bat|cmd|ps1)(/|$) { return 404; }
