# HTTP-context policy; these values are starting limits, not application quotas.
server_tokens off;
more_clear_headers Server X-Powered-By X-AspNet-Version X-AspNetMvc-Version;
autoindex off;
ssi off;
client_max_body_size 5m;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
keepalive_timeout 30s;
keepalive_requests 1000;
ignore_invalid_headers on;
underscores_in_headers off;
large_client_header_buffers 4 8k;
limit_req_zone $binary_remote_addr zone=forge_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=forge_connections:10m;
limit_req_status 429;
limit_conn_status 429;
# Compression is off by default for pages carrying secrets (BREACH considerations).
gzip off;
