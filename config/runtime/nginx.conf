# Integrated NginxForge security configuration (requires NGINX 1.29.3+; tested with 1.30.6).
# All shared policies are active here; no per-option includes or comment toggles.
# Production: edit this file and conf.d/site.conf.example, then rename the latter site.conf.
# Use the OS-specific nginx.conf from the release package; packaging renders its inline policy.
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    log_format forge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
    # Do not log query strings, Authorization or cookies.
    access_log logs/access.log forge;

    # Shared HTTP security and resource limits.
    server_tokens off;
    more_clear_headers Server X-Powered-By X-AspNet-Version X-AspNetMvc-Version;
    autoindex off;
    ssi off;
    gzip off;
    client_max_body_size 5m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    ignore_invalid_headers on;
    underscores_in_headers off;
    large_client_header_buffers 4 8k;
    limit_req_zone $binary_remote_addr zone=forge_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=forge_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=forge_requests burst=20 nodelay;
    limit_conn forge_connections 20;
    error_page 400 403 404 405 413 414 429 500 502 503 504 /__nginxforge_error.html;
    # NGINXFORGE_PLATFORM_POLICY

    # Shared TLS policy, also inherited by the default SNI-rejection listener.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:forge_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Edge owns response policies; remove conflicting backend values.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # DEPLOYMENT VALUE: replace the API origin and add only actual asset/SSO origins.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://app.example.test; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # DEPLOYMENT VALUES: exact browser origins (scheme/host/port), listed only once.
    map $http_origin $forge_cors_origin {
        default "";
        "https://example.test" "https://example.test";
        "https://app.example.test" "https://app.example.test";
        "https://portal.example.test" "https://portal.example.test";
    }
    map "$http_origin|$forge_cors_origin" $forge_cors_reject_origin {
        "|" 0;
        ~[|]$ 1;
        default 0;
    }
    map $forge_cors_origin $forge_cors_credentials {
        default "true";
        "" "";
    }
    map $http_access_control_request_method $forge_cors_reject_method {
        default 1;
        "" 0;
        GET 0;
        HEAD 0;
        POST 0;
        OPTIONS 0;
    }

    # Shared reverse-proxy policy; domain locations supply only their fixed backend.
    # A child proxy_set_header overrides inheritance: retain the complete forwarding policy.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_intercept_errors on;
    proxy_cache off;
    # DEPLOYMENT VALUES: actual session-cookie names and SSO-compatible SameSite.
    proxy_cookie_flags JSESSIONID secure httponly samesite=lax;
    proxy_cookie_flags SESSION secure httponly samesite=lax;
    # XSRF-TOKEN is deliberately not marked HttpOnly; session lifecycle stays in the app.

    # The only production include: one complete site configuration, not policy fragments.
    include conf.d/*.conf;
    # First start stays loopback-only until a real certificate/domain is supplied.
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root html;
        location = /__nginxforge_error.html { internal; root html; }
        location ~ (^|/)\. { return 404; }
        location ~* ^/(conf|config|logs|temp|private|secrets|uploads|WEB-INF|META-INF)(/|$) { return 404; }
        location ~* \.(conf|config|ini|log|sql|bak|old|orig|save|swp|pem|key|pfx|p12|yaml|yml|env)$ { return 404; }
        location ~* \.(php|phtml|cgi|pl|py|jsp|jspx|asp|aspx|ashx|asmx|shtml|shtm|exe|dll|bat|cmd|ps1)(/|$) { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
