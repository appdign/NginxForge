# First-start profile: loopback only. Activate a reviewed domain template for production TLS.
# Existing installations: merge reviewed settings; do not overwrite your nginx.conf.
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    log_format forge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
    # Query strings, Authorization and cookies are deliberately excluded from this format.
    access_log logs/access.log forge;
    include snippets/http-policy.conf;
    include platform.conf;
    # Optional cross-origin API policy: review origins, then enable its HTTP maps once.
    # include examples/api-cors-http.conf.example;
    # Only *.conf is loaded. *.example files stay inactive until explicitly copied.
    include conf.d/*.conf;
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root html;
        include snippets/response-headers.conf;
        include snippets/server-guards.conf;
        location / { try_files $uri $uri/ =404; }
    }
}
