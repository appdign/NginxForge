# NginxForge common runtime. Site values belong only in site.conf.
# [KISA WEB-09] 과도한 프로세스 권한 위험: 전용 실행 계정/서비스 계정과 파일 권한은 OS에서 점검.
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    # [KISA WEB-26] 로그 무단 열람/변조 위험: 웹 루트 밖 로그와 OS ACL·회전/보존 정책을 적용.
    # URI 경로에도 민감값이 들어갈 수 있으므로 앱의 URL·로그 설계를 함께 점검.
    log_format forge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
    access_log logs/access.log forge;
    add_header_inherit merge;
    include policies/http/tls.conf;
    include site.conf;
}
