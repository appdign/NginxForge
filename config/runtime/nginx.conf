# NginxForge policy switches (NGINX 1.29.3+; tested with 1.30.6).
# Site policies: conf.d/site.conf.example -> site.conf. Comment one include to turn it OFF.
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    log_format forge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
    # Do not log query strings, Authorization or cookies.
    access_log logs/access.log forge;

    # HTTP-only shared policy: comment this line for NGINX TLS defaults.
    include policies/http/tls.conf; # ON: TLS 1.2/1.3, ciphers and session policy

    # Required definitions, not enforcement. Keep even if site rate/CORS policies are OFF.
    limit_req_zone $binary_remote_addr zone=forge_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=forge_connections:10m;
    # Preserve independently selected headers in server/location and error responses.
    add_header_inherit merge;

    # DEPLOYMENT VALUES: exact browser origins (scheme/host/port), listed only once.
    map $http_origin $forge_cors_origin {
        default "";
        "https://example.test" "https://example.test";
        "https://app.example.test" "https://app.example.test";
        "https://portal.example.test" "https://portal.example.test";
    }
    map "$http_origin|$forge_cors_origin" $forge_cors_reject_origin {
        "|" 0;
        ~[|]$ 1;
        default 0;
    }
    map $forge_cors_origin $forge_cors_credentials {
        default "true";
        "" "";
    }
    map $http_access_control_request_method $forge_cors_reject_method {
        default 1;
        "" 0;
        GET 0;
        HEAD 0;
        POST 0;
        OPTIONS 0;
    }

    include conf.d/*.conf;
    # First start stays loopback-only until real domains/certificates are supplied.
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root html;
        include policies/server/identity.conf;
        include policies/server/directory-listing.conf;
        include policies/server/ssi.conf;
        include policies/server/compression.conf;
        include policies/server/body-size.conf;
        include policies/server/timeouts.conf;
        include policies/server/request-rate.conf;
        include policies/server/connection-limit.conf;
        include policies/server/generic-errors.conf;
        include policies/server/symlinks.conf;
        include policies/server/nosniff.conf;
        include policies/server/frame-options.conf;
        include policies/server/referrer-policy.conf;
        include policies/server/csp.conf;
        include policies/server/permissions-policy.conf;
        include policies/server/secret-files.conf;
        include policies/server/script-files.conf;
        include policies/server/uploads.conf;
        include policies/server/management-paths.conf;
        include policies/server/sourcemaps.conf;
        location / { try_files $uri $uri/ =404; }
    }
}
