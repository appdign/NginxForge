# Context: http only. Required definitions for examples/spa-api-websocket.conf.example.
# Include before its server blocks. Definitions alone do not enable a policy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Normalized route matching also covers encoded URI prefixes. Internal generic
# errors stay no-store, including after the original API URI has been redirected.
map $uri $forge_spa_cache_control {
    default "";
    ~^/(api|storagewiz|process_file)(/|$) "no-store";
    /__nginxforge_error.html "no-store";
}
# DEPLOYMENT VALUE: exact HTTPS origin of this site. WebSocket clients without Origin
# are denied on upgrade by default; explicitly review native-client requirements.
map "$http_upgrade|$http_origin" $forge_spa_ws_bad_origin {
    default 1;
    "|" 0;
    "|https://example.test" 0;
    "websocket|https://example.test" 0;
}
