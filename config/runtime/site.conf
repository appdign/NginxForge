# 실제 도메인/인증서/root/허용 출처/API/WS/backend는 이 파일 하나에서 설정합니다.
# 공개 바이너리는 고객사 값을 포함하지 않으므로 초기 상태에서는 요청을 거부합니다.
# 배포할 때 실제 사이트 적용본의 site.conf로 교체합니다. 공통 policies 파일에 도메인을 적지 않습니다.
# Bind only loopback during bootstrap, avoiding reserved public ports on Windows.
# Replace this entire file with the configured deployment site.conf to activate HTTPS.
server { listen 127.0.0.1:8080; server_name _; return 444; }
